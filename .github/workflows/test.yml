name: test
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**/*'
    tags-ignore:
      - '*'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**/*'
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-15-intel
          - macos-latest
          - ubuntu-24.04-arm
          - ubuntu-latest
          - windows-11-arm
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install libasound2-dev pkg-config
      - uses: jdx/mise-action@v4
        with:
          mise_toml: |
            [tools]
            rust = 'latest'
      - run: cargo test
      - run: cargo build -r
