[package]
keywords = [
  "ascii-art",
  "cli",
  "command-line",
  "command-line-tool",
  "emulation",
  "emulator",
  "emulators",
  "libretro",
  "retro-gaming",
  "terminal",
]
name = "asobou"
edition = "2024"
rust-version = "1.97"
description = "Play retro games directly in your terminal"
license = "MIT"
repository = "https://github.com/arianrhodsandlot/asobou"
homepage = "https://github.com/arianrhodsandlot/asobou"
readme = "readme.md"
categories = ["command-line-utilities", "games"]

[dependencies]
base64 = "0.23"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
crossterm = "0.29"
ctrlc = "3"
dirs = "6"
flate2 = "1"
ureq = "3"
zip = "8"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
libloading = "0.9"
ringbuf = "0.5"
serde = { version = "1", features = ["derive"] }
shell-words = "1"
tempfile = "3"
toml = "1"
toml_edit = "0.25"
