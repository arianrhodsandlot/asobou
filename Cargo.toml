[package]
name = "asoby"
edition = "2024"
rust-version = "1.97"
description = "Play retro games directly in your terminal"
license = "MIT"
repository = "https://github.com/arianrhodsandlot/asoby"
homepage = "https://github.com/arianrhodsandlot/asoby"
readme = "readme.md"
keywords = ["emulator", "libretro", "retro-gaming", "terminal", "cli"]
categories = ["command-line-utilities", "games"]

[dependencies]
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
crossterm = "0.29"
ctrlc = "3"
dirs = "5"
flate2 = "1"
ureq = "3"
zip = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
libloading = "0.8"
ringbuf = "0.4"
serde = { version = "1", features = ["derive"] }
shell-words = "1"
tempfile = "3"
toml = "0.8"
toml_edit = "0.22"
viuer = "0.11"
