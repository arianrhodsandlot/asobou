name: release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: write
  id-token: write
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            extension: .exe
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-infrastructure
      - run: yq -p=toml -o=toml -i '.package.version = ("${{ github.ref_name }}" | sub("^v"; ""))' Cargo.toml
      - run: cargo test
      - run: cargo build -r
      - run: mkdir release
      - run: cp target/release/asoby${{ matrix.extension }} release/asoby-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.extension }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: release/*
  publish-crates:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-infrastructure
      - run: yq -p=toml -o=toml -i '.package.version = ("${{ github.ref_name }}" | sub("^v"; ""))' Cargo.toml
      - run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-infrastructure
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - run: yq -p=json -o=json -i '.version = ("${{ github.ref_name }}" | sub("^v"; "")) | .optionalDependencies[] = ("${{ github.ref_name }}" | sub("^v"; ""))' npm/asoby/package.json
      - run: cp "release/asoby-${{ github.ref_name }}-x86_64-apple-darwin" npm/asoby-darwin-x64/asoby
      - run: cp "release/asoby-${{ github.ref_name }}-aarch64-apple-darwin" npm/asoby-darwin-arm64/asoby
      - run: cp "release/asoby-${{ github.ref_name }}-aarch64-unknown-linux-gnu" npm/asoby-linux-arm64-gnu/asoby
      - run: cp "release/asoby-${{ github.ref_name }}-x86_64-unknown-linux-gnu" npm/asoby-linux-x64-gnu/asoby
      - run: cp "release/asoby-${{ github.ref_name }}-aarch64-pc-windows-msvc.exe" npm/asoby-win32-arm64-msvc/asoby.exe
      - run: cp "release/asoby-${{ github.ref_name }}-x86_64-pc-windows-msvc.exe" npm/asoby-win32-x64-msvc/asoby.exe
      - run: |
          for package in npm/asoby-*; do
            (
              cd "$package"
              yq -p=json -o=json -i '.version = ("${{ github.ref_name }}" | sub("^v"; ""))' package.json
              chmod +x asoby*
              npm publish
            )
          done
      - run: npm publish
        working-directory: npm/asoby
  release:
    needs:
      - publish-crates
      - publish-npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*
